name: Backend authentication tests
on:
  push:
    branches:
      - feat/google-id-token-verification
  pull_request:
    paths:
      - "license-server/**"
      - ".github/workflows/backend-auth-tests.yml"
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test backend and desktop adapters
        run: npm run license:test
